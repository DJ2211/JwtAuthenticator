name: Build & Integration Tests (Manual)

# Manual trigger only: Cannot be triggered by outside PRs or arbitrary pushes
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JwtAuthenticator.slnx

      - name: Build solution
        run: dotnet build JwtAuthenticator.slnx --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test JwtAuthenticator.Tests/JwtAuthenticator.Tests.csproj --no-build --configuration Release